services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      APP_NAME: URL Shortener
      APP_ENV: development
      DEBUG: "false"
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+psycopg://urlshortener:urlshortener@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      REDIS_COUNTER_KEY: url:counter
      CACHE_TTL_SECONDS: 86400
      NEGATIVE_CACHE_TTL_SECONDS: 30
      CACHE_REBUILD_LOCK_TTL_SECONDS: 5
      ALIAS_MIN_LENGTH: 3
      ALIAS_MAX_LENGTH: 20
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
